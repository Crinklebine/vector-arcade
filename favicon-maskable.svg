<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Vector Arcade">
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="78%">
      <stop offset="0" stop-color="#0b2c1c"/>
      <stop offset="0.55" stop-color="#06150e"/>
      <stop offset="1" stop-color="#020604"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2bff86" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#2bff86" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#2bff86" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2fff7"/>
      <stop offset="0.42" stop-color="#9dffc2"/>
      <stop offset="1" stop-color="#35ff8c"/>
    </linearGradient>
    <filter id="glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <pattern id="scan" width="4" height="8" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#000000" opacity="0.22"/>
    </pattern>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#scan)" opacity="0.45"/>
  <circle cx="256" cy="268" r="210" fill="url(#halo)"/>

  <!-- Scaled into the central safe zone so circular and squircle masks never clip the mark. -->
  <g transform="translate(256 256) scale(0.78) translate(-256 -256)">
    <path d="M132 116 L256 396 L380 116" fill="none" stroke="#2bff86" stroke-width="96"
          stroke-linecap="butt" stroke-linejoin="miter" filter="url(#glow)" opacity="0.85"/>
    <path d="M132 116 L256 396 L380 116" fill="none" stroke="#58ff9d" stroke-width="64"
          stroke-linecap="butt" stroke-linejoin="miter" filter="url(#soft)" opacity="0.9"/>
    <path d="M132 116 L256 396 L380 116" fill="none" stroke="url(#beam)" stroke-width="40"
          stroke-linecap="butt" stroke-linejoin="miter"/>
    <path d="M132 116 L256 396 L380 116" fill="none" stroke="#ffffff" stroke-width="13"
          stroke-linecap="butt" stroke-linejoin="miter" opacity="0.92"/>
    <circle cx="392" cy="128" r="8" fill="#ff5bd6" opacity="0.9"/>
    <circle cx="120" cy="128" r="6" fill="#5be7ff" opacity="0.8"/>
  </g>
</svg>
