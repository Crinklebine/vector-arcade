<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="mask-icon" href="safari-pinned-tab.svg" color="#35ff8c">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#020805">
<meta name="build" content="__BUILD__">
<meta name="built-at" content="__BUILT_AT__">
<title>Asteroids</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 16px;
    overflow: hidden;
    background: radial-gradient(120% 100% at 50% 0%, #071018 0%, #03060b 55%, #000 100%);
    color: #9fe8ff;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  #stage {
    position: relative;
    width: min(calc(100vw - 32px), 760px, calc(100vh - 140px));
    width: min(calc(100vw - 32px), 760px, calc(100svh - 140px));
    max-width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 12px;
    overflow: hidden;
    background: #03050a;
    box-shadow:
      0 0 0 1px rgba(91, 231, 255, 0.22),
      0 0 34px rgba(91, 231, 255, 0.1),
      0 24px 60px rgba(0, 0, 0, 0.68);
  }
  #game { display: block; width: 100%; height: 100%; }
  #stage::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: radial-gradient(125% 100% at 50% 45%, transparent 52%, rgba(0, 0, 0, 0.6) 100%);
  }
  #stage::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    opacity: 0.5;
    background: repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0) 0 1px, rgba(0, 0, 0, 0.3) 1px 3px);
  }
  #corner {
    position: absolute;
    right: 10px;
    bottom: 10px;
    z-index: 6;
    display: flex;
    gap: 7px;
  }
  #corner button {
    appearance: none;
    -webkit-appearance: none;
    width: 40px;
    height: 34px;
    padding: 0;
    border-radius: 8px;
    border: 1px solid rgba(91, 231, 255, 0.3);
    background: rgba(4, 10, 18, 0.62);
    color: #9fe8ff;
    font: 600 13px/1 ui-monospace, Menlo, monospace;
    letter-spacing: 0.04em;
    cursor: pointer;
    touch-action: none;
  }
  #corner button:hover { border-color: rgba(91, 231, 255, 0.7); }
  #corner button.muted { color: #5b7a88; border-color: rgba(91, 231, 255, 0.14); }
  #corner .menu-link {
    display: none;
    align-items: center;
    justify-content: center;
    width: auto;
    height: 34px;
    padding: 0 9px;
    border-radius: 8px;
    border: 1px solid rgba(91, 231, 255, 0.3);
    background: rgba(4, 10, 18, 0.62);
    color: #9fe8ff;
    font: 600 9.5px/1 ui-monospace, Menlo, monospace;
    letter-spacing: 0.08em;
    text-decoration: none;
    touch-action: none;
    cursor: pointer;
  }
  #corner .menu-link.show { display: flex; }
  #corner .menu-link:hover, #corner .menu-link:focus-visible { border-color: rgba(91, 231, 255, 0.7); }
  #corner .menu-link:focus-visible { outline: 1px solid rgba(91, 231, 255, 0.7); outline-offset: 2px; }
  #touch { display: none; width: min(calc(100vw - 32px), 760px); max-width: 100%; gap: 10px; }
  #touch .cluster { display: flex; gap: 8px; flex: 1; }
  #touch button {
    appearance: none;
    -webkit-appearance: none;
    flex: 1;
    height: 60px;
    padding: 0 6px;
    border-radius: 14px;
    border: 1px solid rgba(91, 231, 255, 0.32);
    background: rgba(8, 20, 30, 0.82);
    color: #bff4ff;
    font: 600 12px/1 ui-monospace, Menlo, monospace;
    letter-spacing: 0.06em;
    touch-action: none;
    cursor: pointer;
  }
  #touch button:active, #touch button.active {
    background: rgba(91, 231, 255, 0.22);
    border-color: rgba(91, 231, 255, 0.9);
    color: #ffffff;
  }
  #touch #btn-fire {
    flex: 1.25;
    color: #ffe66b;
    border-color: rgba(255, 230, 107, 0.42);
    background: rgba(36, 28, 8, 0.7);
  }
  #touch #btn-fire:active, #touch #btn-fire.active {
    background: rgba(255, 230, 107, 0.22);
    border-color: rgba(255, 230, 107, 0.95);
  }
  .hint {
    margin: 0;
    max-width: 860px;
    text-align: center;
    font-size: 11.5px;
    line-height: 1.8;
    letter-spacing: 0.05em;
    color: #46798c;
  }
  .hint b { color: #9fe8ff; font-weight: 600; }
  @media (max-height: 640px) and (pointer: fine) {
    .hint { display: none; }
    #stage { width: min(calc(100vw - 32px), 760px, calc(100svh - 90px)); }
  }
  @media (pointer: coarse) {
    body { padding: 12px; gap: 12px; }
    #touch { display: flex; width: min(calc(100vw - 24px), 760px); }
    #stage { width: min(calc(100vw - 24px), 760px, calc(100svh - 250px)); }
    .hint { display: none; }
  }
  @media (pointer: coarse) and (orientation: landscape) {
    body { flex-direction: row; gap: 12px; padding: 8px; }
    #stage { width: min(calc(100svh - 16px), 68vw, 760px); }
    #touch { display: flex; width: min(30vw, 280px); max-width: 280px; }
    #touch .cluster { flex-direction: column; }
    #touch button { height: auto; min-height: 46px; }
  }
  /* Secret build-info screen: Backquote on the start screen, or five taps
     in the top-right corner. Never available during play. */
  .secret {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(1, 6, 4, 0.94);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: #a8ffc4;
    -webkit-user-select: none;
    user-select: none;
  }
  .secret[hidden] { display: none; }
  .secret-panel {
    width: min(540px, 100%);
    padding: 26px 28px;
    border: 1px solid rgba(120, 255, 170, 0.32);
    border-radius: 14px;
    background: linear-gradient(180deg, rgba(6, 20, 12, 0.96), rgba(2, 9, 5, 0.96));
    box-shadow: 0 0 60px rgba(60, 255, 140, 0.12), inset 0 0 40px rgba(0, 0, 0, 0.6);
  }
  .secret-title {
    margin: 0 0 18px;
    font-size: 13px;
    letter-spacing: 0.18em;
    color: #e0ffee;
  }
  .secret-title span { color: #4d7a5d; }
  .secret dl { display: grid; gap: 9px; margin: 0; }
  .secret dl > div {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 18px;
  }
  .secret dt {
    font-size: 10.5px;
    letter-spacing: 0.16em;
    color: #4d7a5d;
    white-space: nowrap;
  }
  .secret dd {
    margin: 0;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: #d8ffe8;
    text-align: right;
    overflow-wrap: anywhere;
  }
  .secret-close {
    margin: 20px 0 0;
    font-size: 10.5px;
    letter-spacing: 0.14em;
    color: #4d7a5d;
    text-align: center;
  }
</style>
<script
  data-goatcounter="https://crink.goatcounter.com/count"
  async
  src="//gc.zgo.at/count.js"
></script>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="800" height="800" aria-label="Asteroids arcade game"></canvas>
    <div id="corner">
      <a id="menu-link" class="menu-link" href="index.html" title="Back to arcade menu (M)" aria-label="Back to arcade menu (M)">MENU</a>
      <button id="btn-mute" type="button" aria-label="Toggle sound (V)" title="Sound (V)" aria-keyshortcuts="V">&#9834;</button>
      <button id="btn-pause" type="button" aria-label="Pause" title="Pause (P)">II</button>
    </div>
  </div>
  <div id="touch" aria-hidden="true">
    <div class="cluster">
      <button id="btn-left" type="button" tabindex="-1" aria-label="Rotate left">&#8634;</button>
      <button id="btn-thrust" type="button" tabindex="-1" aria-label="Thrust">THRUST</button>
      <button id="btn-right" type="button" tabindex="-1" aria-label="Rotate right">&#8635;</button>
    </div>
    <div class="cluster">
      <button id="btn-hyper" type="button" tabindex="-1" aria-label="Hyperspace">HYPER</button>
      <button id="btn-fire" type="button" tabindex="-1" aria-label="Fire">FIRE</button>
    </div>
  </div>
  <p class="hint"><b>&larr; &rarr;</b> rotate &nbsp;&middot;&nbsp; <b>&uarr;</b> thrust &nbsp;&middot;&nbsp; <b>SPACE</b> fire &nbsp;&middot;&nbsp; <b>H</b> hyperspace &nbsp;&middot;&nbsp; <b>P</b> pause &nbsp;&middot;&nbsp; <span id="menu-hint" hidden><b>M</b> menu &nbsp;&middot;&nbsp; </span><b>V</b> sound &nbsp;&middot;&nbsp; <b>R</b> restart</p>

<div id="secret" class="secret" hidden role="dialog" aria-modal="true" aria-label="System information">
  <div class="secret-panel">
    <p class="secret-title">VECTOR ARCADE <span>// SYSTEM INFO</span></p>
    <dl>
      <div><dt>PAGE</dt><dd>asteroids.html</dd></div>
      <div><dt>BUILD</dt><dd id="secret-build">dev</dd></div>
      <div><dt>BUILT</dt><dd id="secret-built">local build</dd></div>
      <div><dt>RES</dt><dd id="secret-screen">&mdash;</dd></div>
      <div><dt>HIGH SCORE</dt><dd id="secret-hi">000000</dd></div>
    </dl>
    <p class="secret-close">PRESS ` OR TAP TO CLOSE</p>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ------------------------------------------------------------------ setup
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;

  // The return link is only offered when the arcade hub launched this game.
  const menuLink = document.getElementById('menu-link');
  const fromMenu = !!(menuLink && new URLSearchParams(window.location.search).get('from') === 'menu');
  if (fromMenu) {
    menuLink.classList.add('show');
    menuLink.setAttribute('aria-keyshortcuts', 'M');
    menuLink.addEventListener('click', () => saveHi());
    const menuHint = document.getElementById('menu-hint');
    if (menuHint) menuHint.hidden = false;
  }
  function goToMenu() {
    if (!fromMenu) return;
    saveHi();
    window.location.href = 'index.html';
  }

  const TAU = Math.PI * 2;

  const C = {
    bg: '#03050a',
    ship: '#d8fff4',
    shipGlow: '#36ffd0',
    rock: '#9ad7ff',
    rockGlow: '#2f7bff',
    bullet: '#ffe66b',
    bulletGlow: '#ffb300',
    ufo: '#ff7b9c',
    ufoGlow: '#ff2d6b',
    ufoBullet: '#ff5b7f',
    hud: '#8dffc9',
    white: '#ffffff',
    dim: '#3f7f6b',
    flame: '#ffb347',
  };

  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const rand = (a, b) => a + Math.random() * (b - a);
  const dist2 = (ax, ay, bx, by) => {
    const dx = ax - bx;
    const dy = ay - by;
    return dx * dx + dy * dy;
  };

  const ROT_SPEED = 3.9;
  const THRUST_ACCEL = 300;
  const MAX_SPEED = 480;
  const DRAG = 0.34;
  const BULLET_SPEED = 675;
  const BULLET_LIFE = 1.05;
  const FIRE_COOL = 0.17;
  const ROCK_POINTS = { 1: 100, 2: 50, 3: 20 };

  // ------------------------------------------------------------------ state
  const game = {
    mode: 'menu',          // menu | playing | dying | waveclear | paused | gameover
    time: 0,
    score: 0,
    hi: 0,
    lives: 3,
    wave: 1,
    nextExtra: 10000,
    muted: false,
    shake: 0,
    invuln: 0,
    fireCool: 0,
    hyperCool: 0,
    respawnTimer: 0,
    waveTimer: 0,
    ufoTimer: 16,
    newHi: false,
  };

  const ship = {
    x: W / 2,
    y: H / 2,
    vx: 0,
    vy: 0,
    angle: -Math.PI / 2,
    r: 11,
    thrusting: false,
    trail: 0,
  };
  let shipAlive = true;
  const SHIP_WRAP_RADIUS = 30;

  let asteroids = [];
  let bullets = [];
  let ufo = null;
  let particles = [];
  let shockwaves = [];
  let popups = [];
  let menuRocks = [];

  const keys = new Set();
  const touch = { left: false, right: false, thrust: false, fire: false };
  let pendingShot = false;

  const stars = [];
  for (let i = 0; i < 90; i++) {
    stars.push({ x: Math.random() * W, y: Math.random() * H, z: Math.random(), sp: rand(2, 12) });
  }

  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#050b14');
  bgGrad.addColorStop(0.55, '#03050a');
  bgGrad.addColorStop(1, '#020407');

  // ------------------------------------------------------------------ audio
  let audioCtx = null;
  let thrustAudio = null;

  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { audioCtx = new AC(); } catch (e) { return; }
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function tone(freq, dur, type, vol, slideTo, delay) {
    if (!audioCtx || game.muted) return;
    type = type || 'square';
    vol = vol == null ? 0.04 : vol;
    const t0 = audioCtx.currentTime + (delay || 0);
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g).connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.03);
  }

  function noiseBurst(dur, vol, freq) {
    if (!audioCtx || game.muted) return;
    dur = dur || 0.3;
    vol = vol == null ? 0.06 : vol;
    freq = freq || 700;
    const sr = audioCtx.sampleRate;
    const len = Math.max(1, Math.floor(sr * dur));
    const buf = audioCtx.createBuffer(1, len, sr);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) {
      const fade = 1 - i / len;
      d[i] = (Math.random() * 2 - 1) * fade * fade;
    }
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const filt = audioCtx.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.setValueAtTime(freq, audioCtx.currentTime);
    filt.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + dur);
    const g = audioCtx.createGain();
    g.gain.value = vol;
    src.connect(filt).connect(g).connect(audioCtx.destination);
    src.start();
  }

  function updateThrustSound(on) {
    if (!audioCtx) return;
    if (on && !game.muted && !thrustAudio) {
      const sr = audioCtx.sampleRate;
      const len = Math.floor(sr * 1.3);
      const buf = audioCtx.createBuffer(1, len, sr);
      const d = buf.getChannelData(0);
      let last = 0;
      for (let i = 0; i < len; i++) {
        last = (last + (Math.random() * 2 - 1) * 0.26) * 0.965;
        d[i] = last;
      }
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      src.loop = true;
      const filt = audioCtx.createBiquadFilter();
      filt.type = 'lowpass';
      filt.frequency.value = 360;
      const g = audioCtx.createGain();
      g.gain.value = 0.0001;
      src.connect(filt).connect(g).connect(audioCtx.destination);
      src.start();
      g.gain.exponentialRampToValueAtTime(0.05, audioCtx.currentTime + 0.12);
      thrustAudio = { src: src, g: g };
    } else if ((!on || game.muted) && thrustAudio) {
      const node = thrustAudio;
      thrustAudio = null;
      const t = audioCtx.currentTime;
      try {
        node.g.gain.cancelScheduledValues(t);
        node.g.gain.setValueAtTime(0.0001, t);
        node.g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
        node.src.stop(t + 0.16);
      } catch (e) { /* already stopped */ }
    }
  }

  function toggleMute() {
    game.muted = !game.muted;
    if (game.muted) updateThrustSound(false);
    else { ensureAudio(); tone(880, 0.07, 'square', 0.03); }
    syncUi();
  }

  // ------------------------------------------------------------------ persistence
  function loadHi() {
    try { return parseInt(localStorage.getItem('asteroids_hi') || '0', 10) || 0; } catch (e) { return 0; }
  }
  function saveHi() {
    try { localStorage.setItem('asteroids_hi', String(game.hi)); } catch (e) { /* ignore */ }
  }
  game.hi = loadHi();

  // ------------------------------------------------------------------ effects
  function spark(x, y, color, count, speed, life) {
    speed = speed || 120;
    life = life || 0.6;
    for (let i = 0; i < count; i++) {
      const a = rand(0, TAU);
      const sp = speed * (0.2 + Math.random() * 0.9);
      const l = life * (0.55 + Math.random() * 0.7);
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: l, maxLife: l,
        len: rand(3, 9),
        color: color,
      });
    }
  }

  function thrustParticle() {
    const back = ship.angle + Math.PI;
    const sp = rand(50, 130);
    const l = rand(0.18, 0.38);
    particles.push({
      x: ship.x + Math.cos(back) * 16 + rand(-3, 3),
      y: ship.y + Math.sin(back) * 16 + rand(-3, 3),
      vx: Math.cos(back) * sp + ship.vx * 0.45 + rand(-22, 22),
      vy: Math.sin(back) * sp + ship.vy * 0.45 + rand(-22, 22),
      life: l, maxLife: l,
      len: rand(2, 6),
      color: Math.random() < 0.4 ? C.bullet : C.flame,
    });
  }

  function shockwave(x, y, maxR, life, color) {
    shockwaves.push({ x: x, y: y, r: 5, maxR: maxR, life: life, maxLife: life, color: color });
  }

  function addPopup(text, x, y, color) {
    popups.push({ text: text, x: x, y: y, color: color, life: 1.1, maxLife: 1.1 });
  }

  function addScore(n) {
    game.score += n;
    if (game.score > game.hi) {
      game.hi = game.score;
      game.newHi = true;
    }
    while (game.score >= game.nextExtra) {
      game.lives++;
      game.nextExtra += 10000;
      addPopup('EXTRA SHIP', W / 2, 120, C.hud);
      tone(880, 0.09, 'square', 0.05);
      tone(1100, 0.09, 'square', 0.05, null, 0.1);
      tone(1320, 0.16, 'square', 0.05, null, 0.2);
    }
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      const d = Math.exp(-2.4 * dt);
      p.vx *= d;
      p.vy *= d;
    }
  }

  function updateShockwaves(dt) {
    for (let i = shockwaves.length - 1; i >= 0; i--) {
      const s = shockwaves[i];
      s.life -= dt;
      if (s.life <= 0) { shockwaves.splice(i, 1); continue; }
      s.r += (s.maxR - s.r) * Math.min(1, dt * 8);
    }
  }

  function updatePopups(dt) {
    for (let i = popups.length - 1; i >= 0; i--) {
      const p = popups[i];
      p.life -= dt;
      p.y -= 26 * dt;
      if (p.life <= 0) popups.splice(i, 1);
    }
  }

  function updateStars(dt) {
    for (const s of stars) {
      s.y += s.sp * dt * (0.4 + s.z);
      if (s.y > H) { s.y = -2; s.x = Math.random() * W; }
    }
  }

  function wrap(o, margin) {
    if (o.x < -margin) o.x = W + margin;
    else if (o.x > W + margin) o.x = -margin;
    if (o.y < -margin) o.y = H + margin;
    else if (o.y > H + margin) o.y = -margin;
  }

  // ------------------------------------------------------------------ asteroids
  function makeAsteroid(x, y, size, vx, vy) {
    const base = size === 3 ? 44 : size === 2 ? 26 : 15;
    const r = base * (0.9 + Math.random() * 0.22);
    const n = 10 + Math.floor(Math.random() * 4);
    const shape = [];
    for (let i = 0; i < n; i++) shape.push(0.76 + Math.random() * 0.38);
    return {
      x: x, y: y, vx: vx, vy: vy,
      r: r, size: size,
      rot: rand(0, TAU),
      spin: rand(-1.1, 1.1) * (size === 1 ? 1.7 : 1),
      shape: shape,
    };
  }

  function spawnWave() {
    asteroids = [];
    const count = Math.min(11, 3 + game.wave);
    const mult = 1 + (game.wave - 1) * 0.07;
    for (let i = 0; i < count; i++) {
      let x = 0;
      let y = 0;
      let tries = 0;
      do {
        const side = Math.floor(Math.random() * 4);
        if (side === 0) { x = rand(30, W - 30); y = rand(24, 56); }
        else if (side === 1) { x = rand(W - 56, W - 24); y = rand(30, H - 30); }
        else if (side === 2) { x = rand(30, W - 30); y = rand(H - 56, H - 24); }
        else { x = rand(24, 56); y = rand(30, H - 30); }
        tries++;
      } while (tries < 25 && dist2(x, y, W / 2, H / 2) < 215 * 215);

      const aim = Math.atan2(H / 2 - y, W / 2 - x) + rand(-0.85, 0.85);
      const sp = (22 + Math.random() * 40) * mult;
      asteroids.push(makeAsteroid(x, y, 3, Math.cos(aim) * sp, Math.sin(aim) * sp));
    }
  }

  function updateAsteroids(dt) {
    for (const a of asteroids) {
      a.x += a.vx * dt;
      a.y += a.vy * dt;
      a.rot += a.spin * dt;
      wrap(a, a.r + 6);
    }
  }

  function destroyAsteroid(index, opts) {
    opts = opts || {};
    const a = asteroids[index];
    if (!a) return;
    asteroids.splice(index, 1);

    spark(a.x, a.y, C.rock, 9 + a.size * 4, 70 + a.size * 34, 0.55);
    shockwave(a.x, a.y, a.r * 1.7, 0.42, C.rock);
    noiseBurst(0.16 + a.size * 0.07, 0.035 + a.size * 0.012, 950 - a.size * 90);
    tone(190 - a.size * 22, 0.2, 'triangle', 0.022, 55);
    game.shake = Math.max(game.shake, a.size * 2.2);

    if (opts.points !== false) {
      const pts = ROCK_POINTS[a.size] || 0;
      addScore(pts);
      addPopup('+' + pts, a.x, a.y, C.rock);
    }

    if (opts.split !== false && a.size > 1) {
      const baseAng = Math.atan2(a.vy, a.vx);
      const speed = Math.hypot(a.vx, a.vy) * 1.2 + 26;
      for (let k = 0; k < 2; k++) {
        const ang = baseAng + (k === 0 ? -1 : 1) * rand(0.45, 1.1);
        const nx = a.x + Math.cos(ang) * 10;
        const ny = a.y + Math.sin(ang) * 10;
        asteroids.push(makeAsteroid(nx, ny, a.size - 1, Math.cos(ang) * speed, Math.sin(ang) * speed));
      }
    }
  }

  // ------------------------------------------------------------------ ship
  function shoot() {
    let active = 0;
    for (const b of bullets) if (b.player) active++;
    if (active >= 4) return;

    game.fireCool = FIRE_COOL;
    const a = ship.angle + rand(-0.018, 0.018);
    const bx = ship.x + Math.cos(a) * 18;
    const by = ship.y + Math.sin(a) * 18;
    bullets.push({
      x: bx, y: by,
      vx: Math.cos(a) * BULLET_SPEED + ship.vx * 0.32,
      vy: Math.sin(a) * BULLET_SPEED + ship.vy * 0.32,
      life: BULLET_LIFE,
      player: true,
    });
    spark(bx, by, C.bullet, 2, 60, 0.16);
    tone(1150, 0.075, 'square', 0.022, 430);
  }

  function updateShip(dt) {
    const left = keys.has('arrowleft') || keys.has('a') || touch.left;
    const right = keys.has('arrowright') || keys.has('d') || touch.right;
    const thrust = keys.has('arrowup') || keys.has('w') || touch.thrust;

    if (left) ship.angle -= ROT_SPEED * dt;
    if (right) ship.angle += ROT_SPEED * dt;

    if (thrust) {
      ship.vx += Math.cos(ship.angle) * THRUST_ACCEL * dt;
      ship.vy += Math.sin(ship.angle) * THRUST_ACCEL * dt;
      ship.thrusting = true;
      ship.trail -= dt;
      if (ship.trail <= 0) {
        ship.trail = 0.028;
        thrustParticle();
      }
    } else {
      ship.thrusting = false;
    }
    updateThrustSound(ship.thrusting);

    const drag = Math.exp(-DRAG * dt);
    ship.vx *= drag;
    ship.vy *= drag;
    const speed = Math.hypot(ship.vx, ship.vy);
    if (speed > MAX_SPEED) {
      ship.vx = (ship.vx / speed) * MAX_SPEED;
      ship.vy = (ship.vy / speed) * MAX_SPEED;
    }

    ship.x += ship.vx * dt;
    ship.y += ship.vy * dt;
    wrap(ship, 0);

    if (game.fireCool > 0) game.fireCool -= dt;
    if (keys.has(' ') || keys.has('spacebar') || touch.fire || pendingShot) {
      if (game.fireCool <= 0) {
        shoot();
        if (game.fireCool > 0) pendingShot = false;
      }
    }
  }

  function destroyShip() {
    if (!shipAlive || game.mode !== 'playing') return;
    shipAlive = false;
    game.lives--;
    game.mode = 'dying';
    game.respawnTimer = 1.55;
    game.invuln = 0;
    game.shake = 20;
    ship.thrusting = false;
    updateThrustSound(false);

    spark(ship.x, ship.y, C.ship, 26, 230, 0.9);
    spark(ship.x, ship.y, C.flame, 12, 150, 0.6);
    shockwave(ship.x, ship.y, 90, 0.6, C.ship);
    noiseBurst(0.7, 0.1, 700);
    tone(220, 0.55, 'sawtooth', 0.05, 40);
    syncUi();
  }

  function centerClear() {
    for (const a of asteroids) {
      if (dist2(a.x, a.y, W / 2, H / 2) < 165 * 165) return false;
    }
    return true;
  }

  function respawnShip() {
    ship.x = W / 2;
    ship.y = H / 2;
    ship.vx = 0;
    ship.vy = 0;
    ship.angle = -Math.PI / 2;
    ship.thrusting = false;
    ship.trail = 0;
    shipAlive = true;
    game.mode = 'playing';
    game.invuln = 2.5;
    game.fireCool = 0.35;
    game.hyperCool = 0;
    game.respawnTimer = 0;
    shockwave(W / 2, H / 2, 70, 0.5, C.ship);
    tone(440, 0.1, 'square', 0.04);
    tone(660, 0.12, 'square', 0.04, null, 0.1);
    syncUi();
  }

  function hyperspace() {
    if (game.mode !== 'playing' || !shipAlive) return;
    if (game.hyperCool > 0) return;

    spark(ship.x, ship.y, C.shipGlow, 16, 180, 0.5);
    shockwave(ship.x, ship.y, 55, 0.4, C.shipGlow);

    ship.x = rand(90, W - 90);
    ship.y = rand(120, H - 90);
    ship.vx = 0;
    ship.vy = 0;
    ship.thrusting = false;
    updateThrustSound(false);
    game.invuln = 1.4;
    game.hyperCool = 1.8;

    spark(ship.x, ship.y, C.shipGlow, 18, 200, 0.55);
    shockwave(ship.x, ship.y, 60, 0.45, C.shipGlow);
    tone(220, 0.34, 'sine', 0.045, 1500);
    tone(1300, 0.14, 'triangle', 0.02, 300, 0.05);
  }

  // ------------------------------------------------------------------ bullets
  function updateBullets(dt) {
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.life -= dt;
      wrap(b, 4);
      if (b.life <= 0) bullets.splice(i, 1);
    }
  }

  // ------------------------------------------------------------------ UFO
  function resetUfoTimer() {
    game.ufoTimer = Math.max(7, 14 + Math.random() * 10 - game.wave * 0.8);
  }

  function spawnUfo() {
    const small = Math.random() < Math.min(0.7, 0.1 + game.wave * 0.07);
    const fromLeft = Math.random() < 0.5;
    const r = small ? 15 : 25;
    ufo = {
      x: fromLeft ? -52 : W + 52,
      y: rand(110, H - 110),
      vx: (fromLeft ? 1 : -1) * (small ? 175 : 125),
      vy: rand(-40, 40),
      r: r,
      small: small,
      shootTimer: rand(0.8, 1.6),
      turnTimer: rand(0.5, 1.2),
      warble: false,
      soundTimer: 0,
    };
    resetUfoTimer();
  }

  function ufoFire() {
    let tx = ship.x;
    let ty = ship.y;
    if (!ufo.small) {
      tx += rand(-110, 110);
      ty += rand(-110, 110);
    }
    const err = ufo.small ? 0.055 : 0.28;
    const a = Math.atan2(ty - ufo.y, tx - ufo.x) + rand(-err, err);
    bullets.push({
      x: ufo.x, y: ufo.y,
      vx: Math.cos(a) * 360,
      vy: Math.sin(a) * 360,
      life: 2.5,
      player: false,
    });
    tone(420, 0.1, 'sawtooth', 0.02, 180);
  }

  function updateUfo(dt) {
    if (!ufo) {
      game.ufoTimer -= dt;
      if (game.ufoTimer <= 0 && asteroids.length > 0) spawnUfo();
      return;
    }

    ufo.x += ufo.vx * dt;
    ufo.y += ufo.vy * dt;

    ufo.turnTimer -= dt;
    if (ufo.turnTimer <= 0) {
      ufo.vy = rand(-75, 75);
      ufo.turnTimer = rand(0.55, 1.5);
    }
    if (ufo.y < 88) { ufo.y = 88; ufo.vy = Math.abs(ufo.vy); }
    if (ufo.y > H - 88) { ufo.y = H - 88; ufo.vy = -Math.abs(ufo.vy); }

    ufo.soundTimer -= dt;
    if (ufo.soundTimer <= 0) {
      tone(ufo.warble ? 520 : 690, 0.06, 'square', 0.012);
      ufo.warble = !ufo.warble;
      ufo.soundTimer = 0.16;
    }

    if (game.mode === 'playing' && shipAlive) {
      ufo.shootTimer -= dt;
      if (ufo.shootTimer <= 0) {
        ufoFire();
        ufo.shootTimer = rand(1.05, 2.0) - (ufo.small ? 0.25 : 0);
      }
    }

    if (ufo.x < -75 || ufo.x > W + 75) {
      ufo = null;
      resetUfoTimer();
    }
  }

  function hitUfo() {
    if (!ufo) return;
    const pts = ufo.small ? 1000 : 200;
    addScore(pts);
    addPopup('+' + pts, ufo.x, ufo.y, C.ufo);
    spark(ufo.x, ufo.y, C.ufo, 26, 230, 0.75);
    spark(ufo.x, ufo.y, C.white, 8, 160, 0.5);
    shockwave(ufo.x, ufo.y, 100, 0.55, C.ufo);
    noiseBurst(0.42, 0.075, 650);
    tone(620, 0.3, 'sawtooth', 0.04, 90);
    game.shake = Math.max(game.shake, 10);
    ufo = null;
    resetUfoTimer();
  }

  // ------------------------------------------------------------------ collisions
  function handleCollisions() {
    for (let bi = bullets.length - 1; bi >= 0; bi--) {
      const b = bullets[bi];
      if (!b.player) continue;

      if (ufo && dist2(b.x, b.y, ufo.x, ufo.y) < (ufo.r + 4) * (ufo.r + 4)) {
        bullets.splice(bi, 1);
        hitUfo();
        continue;
      }

      for (let ai = asteroids.length - 1; ai >= 0; ai--) {
        const a = asteroids[ai];
        const rr = a.r * 0.85 + 3;
        if (dist2(b.x, b.y, a.x, a.y) < rr * rr) {
          bullets.splice(bi, 1);
          destroyAsteroid(ai);
          break;
        }
      }
    }

    if (game.mode !== 'playing' || !shipAlive || game.invuln > 0) return;

    for (let ai = asteroids.length - 1; ai >= 0; ai--) {
      const a = asteroids[ai];
      const rr = a.r * 0.8 + ship.r;
      if (dist2(ship.x, ship.y, a.x, a.y) < rr * rr) {
        destroyAsteroid(ai, { points: false, split: false });
        destroyShip();
        return;
      }
    }

    if (ufo && dist2(ship.x, ship.y, ufo.x, ufo.y) < (ufo.r + ship.r) * (ufo.r + ship.r)) {
      destroyShip();
      return;
    }

    for (let bi = bullets.length - 1; bi >= 0; bi--) {
      const b = bullets[bi];
      if (b.player) continue;
      const rr = ship.r + 3;
      if (dist2(b.x, b.y, ship.x, ship.y) < rr * rr) {
        bullets.splice(bi, 1);
        destroyShip();
        return;
      }
    }
  }

  // ------------------------------------------------------------------ flow
  function startGame() {
    ensureAudio();
    saveHi();
    game.mode = 'playing';
    game.score = 0;
    game.lives = 3;
    game.wave = 1;
    game.nextExtra = 10000;
    game.newHi = false;
    game.shake = 0;
    game.invuln = 2;
    game.fireCool = 0.35;
    game.hyperCool = 0;
    game.respawnTimer = 0;

    shipAlive = true;
    ship.x = W / 2;
    ship.y = H / 2;
    ship.vx = 0;
    ship.vy = 0;
    ship.angle = -Math.PI / 2;
    ship.thrusting = false;
    ship.trail = 0;

    asteroids = [];
    bullets = [];
    particles = [];
    shockwaves = [];
    popups = [];
    ufo = null;
    pendingShot = false;
    resetUfoTimer();
    updateThrustSound(false);
    spawnWave();

    tone(523, 0.08, 'square', 0.04);
    tone(659, 0.08, 'square', 0.04, null, 0.09);
    tone(784, 0.08, 'square', 0.04, null, 0.18);
    tone(1046, 0.16, 'square', 0.04, null, 0.27);
    syncUi();
  }

  function togglePause() {
    if (game.mode === 'playing') {
      game.mode = 'paused';
      ship.thrusting = false;
      updateThrustSound(false);
      tone(520, 0.07, 'square', 0.03);
    } else if (game.mode === 'paused') {
      game.mode = 'playing';
      tone(700, 0.07, 'square', 0.03);
    }
    syncUi();
  }

  function endGame() {
    game.mode = 'gameover';
    shipAlive = false;
    ship.thrusting = false;
    updateThrustSound(false);
    saveHi();
    tone(392, 0.22, 'square', 0.05);
    tone(311, 0.22, 'square', 0.05, null, 0.24);
    tone(233, 0.22, 'square', 0.05, null, 0.48);
    tone(155, 0.6, 'sawtooth', 0.05, 60, 0.72);
    syncUi();
  }

  function beginWaveClear() {
    game.mode = 'waveclear';
    game.waveTimer = 2.3;
    bullets = [];
    ufo = null;
    ship.thrusting = false;
    updateThrustSound(false);
    tone(523, 0.09, 'square', 0.04);
    tone(659, 0.09, 'square', 0.04, null, 0.1);
    tone(784, 0.09, 'square', 0.04, null, 0.2);
    tone(1046, 0.18, 'square', 0.04, null, 0.3);
    syncUi();
  }

  function nextWave() {
    game.wave++;
    spawnWave();
    ship.x = W / 2;
    ship.y = H / 2;
    ship.vx = 0;
    ship.vy = 0;
    ship.angle = -Math.PI / 2;
    ship.thrusting = false;
    ship.trail = 0;
    shipAlive = true;
    game.mode = 'playing';
    game.invuln = 2.2;
    game.fireCool = 0.35;
    game.hyperCool = 0;
    game.respawnTimer = 0;
    bullets = [];
    ufo = null;
    resetUfoTimer();
    syncUi();
  }

  // ------------------------------------------------------------------ menu scene
  function initMenuRocks() {
    menuRocks = [];
    for (let i = 0; i < 8; i++) {
      const size = i < 2 ? 3 : i < 5 ? 2 : 1;
      const a = makeAsteroid(rand(60, W - 60), rand(60, H - 60), size, rand(-18, 18), rand(-18, 18));
      a.spin = rand(-0.4, 0.4);
      menuRocks.push(a);
    }
  }

  function updateMenu(dt) {
    for (const a of menuRocks) {
      a.x += a.vx * dt;
      a.y += a.vy * dt;
      a.rot += a.spin * dt;
      wrap(a, a.r + 12);
    }
  }

  // ------------------------------------------------------------------ update
  function update(dt) {
    game.time += dt;
    updateStars(dt);
    updateParticles(dt);
    updateShockwaves(dt);
    updatePopups(dt);
    if (game.shake > 0) game.shake = Math.max(0, game.shake - dt * 42);
    if (game.invuln > 0) game.invuln = Math.max(0, game.invuln - dt);
    if (game.hyperCool > 0) game.hyperCool -= dt;

    if (game.mode === 'menu') {
      updateMenu(dt);
      return;
    }
    if (game.mode === 'paused' || game.mode === 'gameover') {
      if (ship.thrusting) {
        ship.thrusting = false;
        updateThrustSound(false);
      }
      return;
    }

    if (game.mode === 'playing') {
      updateShip(dt);
      updateAsteroids(dt);
      updateUfo(dt);
      updateBullets(dt);
      handleCollisions();
      if (game.mode === 'playing' && asteroids.length === 0) beginWaveClear();
    } else if (game.mode === 'dying') {
      updateAsteroids(dt);
      updateUfo(dt);
      updateBullets(dt);
      handleCollisions();
      game.respawnTimer -= dt;
      if (game.respawnTimer <= 0) {
        if (game.lives <= 0) endGame();
        else if (centerClear()) respawnShip();
        else game.respawnTimer = 0.4;
      }
    } else if (game.mode === 'waveclear') {
      game.waveTimer -= dt;
      if (game.waveTimer <= 0) nextWave();
    }
  }

  // ------------------------------------------------------------------ text helpers
  function text(str, x, y, o) {
    o = o || {};
    ctx.save();
    ctx.globalAlpha = o.alpha == null ? 1 : o.alpha;
    ctx.font = (o.weight || 'bold') + ' ' + (o.size || 16) + 'px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
    ctx.textAlign = o.align || 'center';
    ctx.textBaseline = 'middle';
    if (o.spacing) ctx.letterSpacing = o.spacing + 'px';
    ctx.fillStyle = o.color || C.white;
    if (o.glow) {
      ctx.shadowColor = o.color || C.white;
      ctx.shadowBlur = o.glow;
    }
    ctx.fillText(str, x, y);
    ctx.restore();
  }

  function vtext(str, x, y, o) {
    o = o || {};
    ctx.save();
    ctx.globalAlpha = o.alpha == null ? 1 : o.alpha;
    ctx.font = (o.weight || 'bold') + ' ' + (o.size || 16) + 'px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
    ctx.textAlign = o.align || 'center';
    ctx.textBaseline = 'middle';
    if (o.spacing) ctx.letterSpacing = o.spacing + 'px';
    ctx.lineWidth = o.lineWidth || 2;
    ctx.lineJoin = 'round';
    ctx.strokeStyle = o.color || C.white;
    ctx.shadowColor = o.color || C.white;
    ctx.shadowBlur = o.glow == null ? 12 : o.glow;
    ctx.strokeText(str, x, y);
    ctx.restore();
  }

  // ------------------------------------------------------------------ draw
  function drawStars() {
    for (const s of stars) {
      ctx.globalAlpha = 0.05 + s.z * 0.2;
      ctx.fillStyle = s.z > 0.75 ? '#cfefff' : '#7fbdd6';
      const sz = s.z > 0.9 ? 2 : 1;
      ctx.fillRect(s.x, s.y, sz, sz);
    }
    ctx.globalAlpha = 1;
  }

  function drawShipShape(x, y, angle, scale, alpha, thrust) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y);
    ctx.rotate(angle + Math.PI / 2);
    ctx.scale(scale, scale);
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, -16);
    ctx.lineTo(11, 10);
    ctx.lineTo(0, 5);
    ctx.lineTo(-11, 10);
    ctx.closePath();
    ctx.strokeStyle = C.ship;
    ctx.lineWidth = 2;
    ctx.shadowColor = C.shipGlow;
    ctx.shadowBlur = 12;
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.lineWidth = 0.8;
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
    ctx.stroke();

    if (thrust) {
      const len = 7 + Math.random() * 10;
      ctx.beginPath();
      ctx.moveTo(-4.5, 9);
      ctx.lineTo(0, 9 + len);
      ctx.lineTo(4.5, 9);
      ctx.strokeStyle = C.flame;
      ctx.lineWidth = 1.8;
      ctx.shadowColor = C.flame;
      ctx.shadowBlur = 12;
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawShip() {
    if (!shipAlive) return;
    let alpha = 1;
    if (game.invuln > 0) alpha = Math.floor(game.time * 16) % 2 === 0 ? 0.3 : 1;
    const thrust = ship.thrusting && game.mode === 'playing';
    const xs = [ship.x];
    const ys = [ship.y];

    // Draw a wrapped copy on the opposite edge while the hull straddles a
    // seam, so the nose and tail stay visible even when they are on
    // different sides of the screen.
    if (ship.x < SHIP_WRAP_RADIUS) xs.push(ship.x + W);
    else if (ship.x > W - SHIP_WRAP_RADIUS) xs.push(ship.x - W);
    if (ship.y < SHIP_WRAP_RADIUS) ys.push(ship.y + H);
    else if (ship.y > H - SHIP_WRAP_RADIUS) ys.push(ship.y - H);

    for (const x of xs) {
      for (const y of ys) drawShipShape(x, y, ship.angle, 1, alpha, thrust);
    }
  }

  function drawAsteroid(a, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.translate(a.x, a.y);
    ctx.rotate(a.rot);
    const n = a.shape.length;
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const ang = (i / n) * TAU;
      const r = a.r * a.shape[i];
      const px = Math.cos(ang) * r;
      const py = Math.sin(ang) * r;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.strokeStyle = C.rock;
    ctx.lineWidth = 2;
    ctx.shadowColor = C.rockGlow;
    ctx.shadowBlur = 9;
    ctx.stroke();
    ctx.restore();
  }

  function drawUfo(u) {
    const r = u.r;
    ctx.save();
    ctx.translate(u.x, u.y);
    ctx.lineJoin = 'round';
    ctx.strokeStyle = C.ufo;
    ctx.shadowColor = C.ufoGlow;
    ctx.shadowBlur = 12;
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(-r, 0);
    ctx.lineTo(-r * 0.55, -r * 0.42);
    ctx.lineTo(r * 0.55, -r * 0.42);
    ctx.lineTo(r, 0);
    ctx.lineTo(r * 0.55, r * 0.42);
    ctx.lineTo(-r * 0.55, r * 0.42);
    ctx.closePath();
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(0, -r * 0.42, r * 0.55, Math.PI, 0);
    ctx.stroke();

    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-r * 0.86, 0);
    ctx.lineTo(r * 0.86, 0);
    ctx.stroke();

    const blink = Math.floor(game.time * 6) % 2 === 0;
    ctx.fillStyle = blink ? C.ufo : 'rgba(255,123,156,0.35)';
    ctx.shadowBlur = 8;
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.arc(i * r * 0.42, r * 0.18, 1.6, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawBullets() {
    ctx.save();
    ctx.lineCap = 'round';
    for (const b of bullets) {
      const color = b.player ? C.bullet : C.ufoBullet;
      ctx.strokeStyle = color;
      ctx.shadowColor = b.player ? C.bulletGlow : C.ufoGlow;
      ctx.shadowBlur = 10;
      ctx.lineWidth = 2.8;
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(b.x - b.vx * 0.026, b.y - b.vy * 0.026);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawParticles() {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineWidth = 1.7;
    for (const p of particles) {
      const a = clamp(p.life / p.maxLife, 0, 1);
      ctx.globalAlpha = a;
      ctx.strokeStyle = p.color;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - p.vx * 0.028, p.y - p.vy * 0.028);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawShockwaves() {
    ctx.save();
    for (const s of shockwaves) {
      const a = clamp(s.life / s.maxLife, 0, 1);
      ctx.globalAlpha = a * 0.65;
      ctx.strokeStyle = s.color;
      ctx.lineWidth = 2;
      ctx.shadowColor = s.color;
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, TAU);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawPopups() {
    for (const p of popups) {
      const a = clamp(p.life / p.maxLife, 0, 1);
      text(p.text, p.x, p.y, { size: 15, color: p.color, alpha: a, glow: 8, spacing: 1 });
    }
  }

  function drawWorld() {
    for (const a of asteroids) drawAsteroid(a, 1);
    if (ufo) drawUfo(ufo);
    drawShockwaves();
    drawBullets();
    drawShip();
    drawParticles();
    drawPopups();
  }

  // ------------------------------------------------------------------ HUD
  const hudFade = ctx.createLinearGradient(0, 0, 0, 92);
  hudFade.addColorStop(0, 'rgba(3, 5, 10, 0.88)');
  hudFade.addColorStop(1, 'rgba(3, 5, 10, 0)');

  const footFade = ctx.createLinearGradient(0, H - 64, 0, H);
  footFade.addColorStop(0, 'rgba(3, 5, 10, 0)');
  footFade.addColorStop(1, 'rgba(3, 5, 10, 0.7)');

  function drawHud() {
    ctx.fillStyle = hudFade;
    ctx.fillRect(0, 0, W, 92);
    ctx.fillStyle = footFade;
    ctx.fillRect(0, H - 64, W, 64);

    text('SCORE', 28, 18, { size: 12, color: 'rgba(141,255,201,0.55)', align: 'left', spacing: 3 });
    text(String(game.score).padStart(6, '0'), 28, 42, { size: 27, color: C.ship, align: 'left', glow: 10, spacing: 1 });

    text('HI-SCORE', W / 2, 18, { size: 12, color: 'rgba(141,255,201,0.55)', spacing: 3 });
    text(String(game.hi).padStart(6, '0'), W / 2, 42, { size: 27, color: C.ship, glow: 10, spacing: 1 });

    text('WAVE', W - 28, 18, { size: 12, color: 'rgba(141,255,201,0.55)', align: 'right', spacing: 3 });
    text(String(game.wave).padStart(2, '0'), W - 28, 42, { size: 27, color: C.ship, align: 'right', glow: 10, spacing: 1 });

    const shown = Math.min(game.lives, 5);
    for (let i = 0; i < shown; i++) {
      drawShipShape(30 + i * 26, H - 26, -Math.PI / 2, 0.55, 0.8, false);
    }
    if (game.lives > 5) {
      text('x' + game.lives, 30 + 5 * 26, H - 26, { size: 13, color: C.ship, align: 'left', glow: 6 });
    }
  }

  // ------------------------------------------------------------------ menu
  function drawMenu() {
    for (const a of menuRocks) drawAsteroid(a, 0.28);

    vtext('ASTEROIDS', W / 2, 196, { size: 92, color: C.ship, glow: 28, spacing: 6, lineWidth: 2.4 });
    text('VECTOR SURVIVAL', W / 2, 256, { size: 14, color: 'rgba(141,255,201,0.7)', spacing: 6 });

    const bob = Math.sin(game.time * 1.4) * 6;
    const angle = -Math.PI / 2 + Math.sin(game.time * 0.65) * 0.32;
    drawShipShape(W / 2, 400 + bob, angle, 1.85, 0.95, Math.sin(game.time * 18) > 0.1);

    const blink = 0.55 + 0.45 * Math.sin(game.time * 3.6);
    text('PRESS SPACE OR TAP TO START', W / 2, 552, {
      size: 21,
      color: C.bullet,
      glow: 14,
      alpha: blink,
      spacing: 1,
    });

    text('\u2190 \u2192  ROTATE     \u2191  THRUST     SPACE  FIRE', W / 2, 632, {
      size: 14,
      color: 'rgba(159,232,255,0.75)',
      spacing: 1,
    });
    text('H  HYPERSPACE     P  PAUSE     ' + (fromMenu ? 'M  MENU     ' : '') + 'V  SOUND     R  RESTART', W / 2, 662, {
      size: 12,
      color: '#46798c',
      spacing: 1,
      weight: '600',
    });
    text('EXTRA SHIP EVERY 10,000 POINTS', W / 2, 706, {
      size: 12,
      color: 'rgba(141,255,201,0.55)',
      spacing: 2,
      weight: '600',
    });
    text('HI-SCORE  ' + String(game.hi).padStart(6, '0'), W / 2, 764, {
      size: 14,
      color: 'rgba(141,255,201,0.7)',
      spacing: 3,
    });
  }

  // ------------------------------------------------------------------ overlays
  function dialogPanel(x, y, w, h) {
    ctx.fillStyle = 'rgba(3, 5, 10, 0.94)';
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = 'rgba(91, 231, 255, 0.2)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(x + 0.75, y + 0.75, w - 1.5, h - 1.5);
  }

  function drawOverlays() {
    if (game.mode === 'paused') {
      ctx.fillStyle = 'rgba(3, 5, 10, 0.6)';
      ctx.fillRect(0, 0, W, H);
      dialogPanel(170, 296, 460, 196);
      vtext('PAUSED', W / 2, 360, { size: 64, color: C.shipGlow, glow: 28, spacing: 6 });
      text('PRESS P TO RESUME', W / 2, 424, { size: 17, color: 'rgba(159,232,255,0.8)', spacing: 3 });
      text('R  RESTART      V  SOUND' + (fromMenu ? '      M  MENU' : ''), W / 2, 460, { size: 12, color: '#46798c', spacing: 3, weight: '600' });
    } else if (game.mode === 'gameover') {
      const blink = 0.5 + 0.5 * Math.sin(game.time * 3.8);
      ctx.fillStyle = 'rgba(3, 5, 10, 0.8)';
      ctx.fillRect(0, 0, W, H);

      vtext('GAME OVER', W / 2, 268, { size: 76, color: C.ufo, glow: 30, spacing: 5, lineWidth: 2.4 });

      text('FINAL SCORE', W / 2, 380, { size: 12, color: 'rgba(141,255,201,0.6)', spacing: 4 });
      text(String(game.score).padStart(6, '0'), W / 2, 416, { size: 42, color: C.ship, glow: 16, spacing: 2 });

      text('HI-SCORE  ' + String(game.hi).padStart(6, '0'), W / 2, 474, {
        size: 13,
        color: 'rgba(141,255,201,0.65)',
        spacing: 3,
      });
      text('WAVE REACHED ' + String(game.wave).padStart(2, '0'), W / 2, 506, {
        size: 13,
        color: 'rgba(159,232,255,0.6)',
        spacing: 3,
      });

      if (game.newHi) {
        text('NEW HIGH SCORE!', W / 2, 552, { size: 20, color: C.bullet, glow: 14, alpha: blink, spacing: 2 });
      }

      text('PRESS SPACE OR TAP TO PLAY AGAIN', W / 2, 648, {
        size: 19,
        color: C.ship,
        glow: 10,
        alpha: blink,
        spacing: 1,
      });
      text('R  ALSO RESTARTS', W / 2, 690, { size: 12, color: '#46798c', spacing: 2, weight: '600' });
    } else if (game.mode === 'waveclear') {
      ctx.fillStyle = 'rgba(3, 5, 10, 0.3)';
      ctx.fillRect(0, 0, W, H);
      dialogPanel(110, 318, 580, 164);
      vtext('WAVE ' + String(game.wave).padStart(2, '0') + ' CLEARED', W / 2, 378, {
        size: 40,
        color: C.hud,
        glow: 22,
        spacing: 3,
      });
      text('GET READY', W / 2, 434, { size: 13, color: 'rgba(159,232,255,0.7)', spacing: 4 });
    }
  }

  // ------------------------------------------------------------------ render
  function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    drawStars();

    ctx.save();
    if (game.shake > 0) {
      ctx.translate(rand(-game.shake, game.shake) * 0.5, rand(-game.shake, game.shake) * 0.5);
    }
    if (game.mode === 'menu') drawMenu();
    else drawWorld();
    ctx.restore();

    if (game.mode !== 'menu') {
      drawHud();
      drawOverlays();
    }

    ctx.strokeStyle = 'rgba(91, 231, 255, 0.08)';
    ctx.lineWidth = 1;
    ctx.strokeRect(5.5, 5.5, W - 11, H - 11);
  }

  // ------------------------------------------------------------------ ui
  function syncUi() {
    const pauseBtn = document.getElementById('btn-pause');
    const muteBtn = document.getElementById('btn-mute');
    if (pauseBtn) {
      pauseBtn.textContent = game.mode === 'paused' ? '\u25B6' : 'II';
      pauseBtn.setAttribute('aria-label', game.mode === 'paused' ? 'Resume' : 'Pause');
      pauseBtn.title = game.mode === 'paused' ? 'Resume (P)' : 'Pause (P)';
    }
    if (muteBtn) {
      muteBtn.classList.toggle('muted', game.muted);
      muteBtn.textContent = game.muted ? '\u266A' : '\u266B';
      muteBtn.setAttribute('aria-label', game.muted ? 'Enable sound (V)' : 'Mute sound (V)');
      muteBtn.title = game.muted ? 'Sound off (V)' : 'Sound on (V)';
    }
  }

  // ------------------------------------------------------------------ loop
  let lastTime = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - lastTime) / 1000));
    lastTime = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  // ------------------------------------------------------------------ input
  // ------------------------------------------------------------- secret info
  const secretEl = document.getElementById('secret');
  const secretBuildEl = document.getElementById('secret-build');
  const secretBuiltEl = document.getElementById('secret-built');
  const secretScreenEl = document.getElementById('secret-screen');
  const secretHiEl = document.getElementById('secret-hi');
  let secretOpen = false;
  let secretTaps = [];

  function openSecret() {
    if (game.mode !== 'menu') return;
    try {
      const rawBuild = (document.querySelector('meta[name="build"]') || {}).content || '';
      const rawBuilt = (document.querySelector('meta[name="built-at"]') || {}).content || '';
      secretBuildEl.textContent = rawBuild && rawBuild !== '__BUILD__' ? rawBuild : 'dev';
      secretBuiltEl.textContent = rawBuilt && rawBuilt !== '__BUILT_AT__'
        ? rawBuilt.replace('T', ' ').replace('Z', ' UTC')
        : 'local build';
      let hi = '0';
      try { hi = localStorage.getItem('asteroids_hi') || '0'; } catch (e) { /* storage unavailable */ }
      secretHiEl.textContent = String(parseInt(hi, 10) || 0).padStart(6, '0');
      secretScreenEl.textContent = window.innerWidth + ' x ' + window.innerHeight + ' @ ' + (window.devicePixelRatio || 1) + 'x';
    } catch (e) { /* never let the info screen break the game */ }
    secretOpen = true;
    secretEl.hidden = false;
  }

  function closeSecret() {
    secretOpen = false;
    secretEl.hidden = true;
  }

  function toggleSecret() {
    if (secretOpen) closeSecret();
    else openSecret();
  }

  const secretStage = document.getElementById('stage');
  if (secretStage) {
    secretStage.addEventListener('pointerdown', (e) => {
      if (secretOpen) { closeSecret(); return; }
      if (game.mode !== 'menu') return;
      const r = secretStage.getBoundingClientRect();
      if (e.clientX < r.right - 64 || e.clientX > r.right + 8 ||
          e.clientY < r.top - 8 || e.clientY > r.top + 64) return;
      e.preventDefault();
      e.stopPropagation();
      const now = performance.now();
      secretTaps = secretTaps.filter((t) => now - t < 2500);
      secretTaps.push(now);
      if (secretTaps.length >= 5) { secretTaps = []; openSecret(); }
    }, true);
  }
  secretEl.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    closeSecret();
  });

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Backquote') {
      e.preventDefault();
      if (!e.repeat) toggleSecret();
      return;
    }
    if (secretOpen) {
      e.preventDefault();
      if (!e.repeat && (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ')) closeSecret();
      return;
    }
    const k = e.key;
    if (k === ' ' || k === 'Spacebar' || k.indexOf('Arrow') === 0) e.preventDefault();
    ensureAudio();
    const key = k.toLowerCase();
    keys.add(key);
    if (e.repeat) return;

    if (key === 'm') { goToMenu(); return; }
    if (key === 'v') { toggleMute(); return; }
    if (key === 'p' || key === 'escape') { togglePause(); return; }
    if (key === 'h') { hyperspace(); return; }
    if (key === 'r') {
      if (game.mode !== 'menu') startGame();
      return;
    }
    if (key === ' ' || key === 'enter') {
      if (game.mode === 'menu' || game.mode === 'gameover') { startGame(); return; }
      if (game.mode === 'paused') { togglePause(); return; }
    }
  });

  window.addEventListener('keyup', (e) => {
    keys.delete(e.key.toLowerCase());
  });

  window.addEventListener('blur', () => {
    keys.clear();
    touch.left = touch.right = touch.thrust = touch.fire = false;
    updateThrustSound(false);
    if (game.mode === 'playing') {
      game.mode = 'paused';
      syncUi();
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && game.mode === 'playing') {
      game.mode = 'paused';
      ship.thrusting = false;
      updateThrustSound(false);
      syncUi();
    }
  });

  window.addEventListener('pagehide', saveHi);

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    ensureAudio();
    if (game.mode === 'menu' || game.mode === 'gameover') { startGame(); return; }
    if (game.mode === 'paused') { togglePause(); return; }
    if (game.mode === 'playing') pendingShot = true;
  });

  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  function bindHold(el, onDown, onUp) {
    if (!el) return;
    const down = (e) => {
      e.preventDefault();
      ensureAudio();
      el.classList.add('active');
      try { el.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      onDown();
    };
    const up = () => {
      el.classList.remove('active');
      onUp();
    };
    el.addEventListener('pointerdown', down);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    el.addEventListener('pointerleave', up);
    el.addEventListener('lostpointercapture', up);
    el.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  bindHold(
    document.getElementById('btn-left'),
    () => { touch.left = true; },
    () => { touch.left = false; }
  );
  bindHold(
    document.getElementById('btn-right'),
    () => { touch.right = true; },
    () => { touch.right = false; }
  );
  bindHold(
    document.getElementById('btn-thrust'),
    () => { touch.thrust = true; },
    () => { touch.thrust = false; }
  );
  bindHold(
    document.getElementById('btn-fire'),
    () => {
      touch.fire = true;
      pendingShot = true;
      if (game.mode === 'menu' || game.mode === 'gameover') startGame();
    },
    () => { touch.fire = false; }
  );
  bindHold(
    document.getElementById('btn-hyper'),
    () => {
      hyperspace();
      if (game.mode === 'menu' || game.mode === 'gameover') startGame();
    },
    () => {}
  );

  const pauseBtn = document.getElementById('btn-pause');
  if (pauseBtn) {
    pauseBtn.addEventListener('click', (e) => {
      e.preventDefault();
      ensureAudio();
      togglePause();
    });
  }
  const muteBtn = document.getElementById('btn-mute');
  if (muteBtn) {
    muteBtn.addEventListener('click', (e) => {
      e.preventDefault();
      ensureAudio();
      toggleMute();
    });
  }

  // ------------------------------------------------------------------ go
  initMenuRocks();
  syncUi();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
