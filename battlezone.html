        sctx.lineWidth = 1;
        sctx.beginPath(); sctx.arc(p.x, p.y, 5, 0, TAU); sctx.stroke();
      }
    }
    sctx.restore();
  }

  function renderScene() {
    // Phosphor persistence: instead of clearing, fade the previous vector
    // frame toward black so fast lines leave a faint CRT afterglow.
    sctx.save();
    sctx.globalCompositeOperation = 'source-over';
    sctx.fillStyle = 'rgba(2,7,5,0.42)';
    sctx.fillRect(0, 0, W, H);
    sctx.restore();

    camCos = Math.cos(cam.h);
    camSin = Math.sin(cam.h);
    beginScenePaths();
    sceneFx = [];

    drawSky();
    drawWorldGeometry();
    drawEffects3D();
    drawUnits();
    drawProjectiles();
    strokeScenePaths();
    drawSceneFx();
  }

  // ------------------------------------------------------------------ hud / radar
  function setFont(size, weight) {
    ctx.font = (weight || 'bold') + ' ' + size + 'px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
  }

  function text(str, x, y, o) {
    o = o || {};
    ctx.save();
    ctx.globalAlpha = o.alpha == null ? 1 : o.alpha;
    setFont(o.size || 15, o.weight);
    ctx.textAlign = o.align || 'center';
    ctx.textBaseline = 'middle';
    if (o.spacing != null && 'letterSpacing' in ctx) ctx.letterSpacing = o.spacing + 'px';
    ctx.fillStyle = o.color || C.hud;
    if (o.glow) {
      ctx.shadowColor = o.color || C.hud;
      ctx.shadowBlur = o.glow;
    }
    ctx.fillText(str, x, y);
    ctx.restore();
  }

  function vtext(str, x, y, o) {
    o = o || {};
    ctx.save();
    ctx.globalAlpha = o.alpha == null ? 1 : o.alpha;
    setFont(o.size || 15, o.weight);
    ctx.textAlign = o.align || 'center';
    ctx.textBaseline = 'middle';
    if (o.spacing != null && 'letterSpacing' in ctx) ctx.letterSpacing = o.spacing + 'px';
    ctx.lineWidth = o.lineWidth || 1.8;
    ctx.lineJoin = 'round';
    ctx.strokeStyle = o.color || C.hud;
    ctx.shadowColor = o.color || C.hud;
    ctx.shadowBlur = o.glow == null ? 14 : o.glow;
    ctx.strokeText(str, x, y);
    ctx.restore();
  }

  function panel(x, y, w, h, alpha) {
    ctx.fillStyle = 'rgba(1,8,4,' + (alpha == null ? 0.78 : alpha) + ')';
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 7);
    ctx.fill();
    ctx.strokeStyle = 'rgba(132,255,172,0.25)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function drawTankIcon(x, y, s, color) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(x - s, y + s * 0.55);
    ctx.lineTo(x - s * 0.65, y - s * 0.45);
    ctx.lineTo(x + s * 0.65, y - s * 0.45);
    ctx.lineTo(x + s, y + s * 0.55);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, y - s * 0.45);
    ctx.lineTo(x, y - s * 0.9);
    ctx.stroke();
    ctx.restore();
  }

  function drawHud() {
    // Coarse-pointer layouts scale the canvas down a long way, so the HUD gets
    // a modest internal size boost to stay legible on a phone.
    const ui = touchControlsActive() ? 1.24 : 1;
    const topGrad = ctx.createLinearGradient(0, 0, 0, 112);
    topGrad.addColorStop(0, 'rgba(0,7,4,0.8)');
    topGrad.addColorStop(1, 'rgba(0,7,4,0)');
    ctx.fillStyle = topGrad;
    ctx.fillRect(0, 0, W, 112);

    text('SCORE', 30, 20, { size: 10 * ui, color: C.dim, align: 'left', spacing: 3, weight: '600' });
    text(pad(game.score, 6), 30, 46, { size: 28 * ui, color: C.hud, align: 'left', glow: 9, spacing: 1 });
    text('HI ' + pad(game.hi, 6), 30, 75, { size: 10 * ui, color: C.dim, align: 'left', spacing: 2, weight: '600' });

    text('WAVE', W / 2, 20, { size: 10 * ui, color: C.dim, spacing: 4, weight: '600' });
    text(pad(game.wave, 2), W / 2, 50, { size: 29 * ui, color: C.hud, glow: 9, spacing: 2 });

    text('LIVES', W - 30, 20, { size: 10 * ui, color: C.dim, align: 'right', spacing: 3, weight: '600' });
    for (let i = 0; i < 3; i++) {
      const on = i < game.lives;
      drawTankIcon(W - 30 - i * 24 * ui, 43, 7.5 * ui, on ? C.hud : 'rgba(83,143,106,0.28)');
    }

    text('SHELLS', W - 30, 65, { size: 9 * ui, color: C.dim, align: 'right', spacing: 2, weight: '600' });
    if (game.ammo === 0) {
      const blink = 0.55 + 0.45 * Math.sin(game.time * 8);
      text('RELOAD', W - 96, 78, { size: 9 * ui, color: C.hudWarm, align: 'right', alpha: blink, spacing: 1 });
    }
    for (let i = 0; i < AMMO_MAX; i++) {
      const bw = 7 * ui, gap = 11 * ui;
      const x = W - 30 - (AMMO_MAX - 1 - i) * gap - bw;
      ctx.fillStyle = i < game.ammo ? 'rgba(168,255,196,0.9)' : 'rgba(83,143,106,0.28)';
      ctx.fillRect(x, 73, bw, 9 * ui);
    }
    const rw = 58 * ui;
    ctx.fillStyle = 'rgba(83,143,106,0.22)';
    ctx.fillRect(W - 30 - rw, 87, rw, 2);
    if (game.ammo < AMMO_MAX) {
      const frac = clamp(1 - game.reload / RELOAD_TIME, 0, 1);
      ctx.fillStyle = 'rgba(168,255,196,0.55)';
      ctx.fillRect(W - 30 - rw, 87, rw * frac, 2);
    }

    if (game.mode !== 'gameover') drawRadar();
    drawWarning();
    drawPopups();
    if (game.mode === 'playing' || game.mode === 'paused') drawCrosshair();

    if (game.messageT > 0 && game.mode !== 'gameover') {
      const a = clamp(game.messageT * 1.8, 0, 1);
      text(game.message, W / 2, 522, {
        size: 13 * (touchControlsActive() ? 1.2 : 1), color: C.hud, alpha: a, spacing: 2, glow: 8,
      });
    }

    if (touchControlsActive()) drawTouchControls();
  }

  function drawRadar() {
    const w = 352, h = 186;
    const x = Math.round((W - w) / 2), y = 546;
    const cx = W / 2, cy = y + 105, R = 68;
    const range = RADAR_RANGE;
    panel(x, y, w, h, 0.74);

    text('RADAR', x + 16, y + 17, { size: 10, color: C.dim, align: 'left', spacing: 3, weight: '600' });
    text('RANGE ' + range, x + w - 16, y + 17, { size: 10, color: C.dim, align: 'right', spacing: 2, weight: '600' });

    ctx.save();
    ctx.strokeStyle = 'rgba(132,255,172,0.22)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, R * 0.66, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, R * 0.33, 0, TAU); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx - R, cy); ctx.lineTo(cx + R, cy);
    ctx.moveTo(cx, cy - R); ctx.lineTo(cx, cy + R);
    ctx.stroke();

    // Bearing ticks every 45 degrees, with the forward tick drawn brighter.
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * TAU - Math.PI / 2;
      const long = i === 0;
      ctx.strokeStyle = long ? 'rgba(168,255,196,0.55)' : 'rgba(132,255,172,0.2)';
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * (R + 2), cy + Math.sin(a) * (R + 2));
      ctx.lineTo(cx + Math.cos(a) * (R + (long ? 9 : 5)), cy + Math.sin(a) * (R + (long ? 9 : 5)));
      ctx.stroke();
    }

    const sweep = game.time * 1.25;
    ctx.fillStyle = 'rgba(132,255,172,0.06)';
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, R, sweep - 0.6, sweep);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(168,255,196,0.45)';
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(sweep) * R, cy + Math.sin(sweep) * R);
    ctx.stroke();

    ctx.translate(cx, cy);
    ctx.fillStyle = C.hud;
    ctx.beginPath();
    ctx.moveTo(0, -8);
    ctx.lineTo(6, 6);
    ctx.lineTo(0, 3.5);
    ctx.lineTo(-6, 6);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    if (game.mode === 'menu') return;
    for (const e of enemies) {
      if (!e.alive) continue;
      const dx = e.x - player.x;
      const dz = e.z - player.z;
      const d = Math.hypot(dx, dz);
      if (d > range) continue;
      // Radar is player-centric and rotates with the hull: forward is up.
      const fwd = dx * Math.sin(player.h) + dz * Math.cos(player.h);
      const right = dx * Math.cos(player.h) - dz * Math.sin(player.h);
      const bx = cx + (right / range) * R;
      const by = cy - (fwd / range) * R;
      const hot = e.hasLOS && e.aimT > e.reaction * 0.45;
      const col = hot ? '#ffb052' : '#a8ffc4';
      ctx.save();
      ctx.translate(bx, by);
      ctx.rotate(e.h - player.h);
      ctx.fillStyle = col;
      if (hot) {
        ctx.shadowColor = col;
        ctx.shadowBlur = 7;
      }
      if (e.type === 'saucer') {
        ctx.beginPath(); ctx.arc(0, 0, 4.2, 0, TAU); ctx.fill();
      } else {
        const sz = e.type === 'heavy' ? 6.2 : 4.8;
        ctx.beginPath();
        ctx.moveTo(0, -sz);
        ctx.lineTo(sz, sz); ctx.lineTo(-sz, sz);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
      if (hot) {
        ctx.strokeStyle = 'rgba(255,176,82,0.4)';
        ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.arc(bx, by, 9, 0, TAU); ctx.stroke();
      }
    }
  }

  function drawWarning() {
    if (game.mode !== 'playing' || !player.alive) return;
    const blink = 0.55 + 0.45 * Math.sin(game.time * 9);
    if (game.threatShot) {
      let arrow = 'V';
      let nearest = null;
      let nd = Infinity;
      for (const s of enemyShots) {
        const d = dist2(s.x, s.z, player.x, player.z);
        if (d < nd) { nd = d; nearest = s; }
      }
      if (nearest) {
        const rel = wrapAngle(angleTo(player.x, player.z, nearest.x, nearest.z) - player.h);
        arrow = Math.abs(rel) > 2.4 ? 'V' : rel > 0 ? '>>' : '<<';
      }
      text('!! INCOMING ' + arrow, W / 2, 104, {
        size: 13, color: C.hudRed, glow: 12, alpha: blink, spacing: 3,
      });
    } else if (game.threatAim) {
      text('!! TARGET LOCK', W / 2, 104, {
        size: 12, color: C.hudWarm, glow: 10, alpha: blink, spacing: 3,
      });
    }
  }

  function findGunTarget() {
    if (!player.alive) return null;
    let best = null;
    let bestAng = 0.06;
    for (const e of enemies) {
      if (!e.alive) continue;
      const d = Math.hypot(e.x - player.x, e.z - player.z);
      if (d > 1050) continue;
      const ang = Math.abs(wrapAngle(angleTo(player.x, player.z, e.x, e.z) - player.h));
      if (ang < bestAng) { bestAng = ang; best = e; }
    }
    return best;
  }

  function drawCrosshair() {
    const cx = W / 2, cy = HORIZON;
    const target = findGunTarget();
    const ready = game.ammo > 0;
    const col = ready ? (target ? '#ffd08a' : '#a8ffc4') : '#ff9a5e';
    const spread = game.fireCool > 0 ? (FIRE_DELAY - game.fireCool) * 9 : 0;

    ctx.save();
    ctx.strokeStyle = col;
    ctx.lineWidth = 1.4;
    ctx.shadowColor = col;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(cx, cy, 10 + spread, 0, TAU);
    ctx.stroke();
    for (let i = 0; i < 4; i++) {
      const a = i * (TAU / 4) + Math.PI / 4;
      const r0 = 15 + spread, r1 = 22 + spread;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
      ctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
      ctx.stroke();
    }
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(cx, cy, 1.5, 0, TAU); ctx.fill();
    ctx.restore();

    if (game.hitMarker > 0) {
      const a = game.hitMarker / 0.16;
      ctx.save();
      ctx.strokeStyle = 'rgba(255,240,190,' + a.toFixed(3) + ')';
      ctx.lineWidth = 2;
      for (let i = 0; i < 4; i++) {
        const s = i % 2 ? 1 : -1;
        const v = i < 2 ? 1 : -1;
        ctx.beginPath();
        ctx.moveTo(cx + s * 8, cy + v * 8);
        ctx.lineTo(cx + s * 14, cy + v * 14);
        ctx.stroke();
      }
      ctx.restore();
    }

    if (target) {
      const p = projectWorld(target.x, target.type === 'saucer' ? target.y : 9, target.z);
      if (p) {
        const s = target.type === 'heavy' ? 24 : 18;
        ctx.save();
        ctx.strokeStyle = 'rgba(255,208,138,0.8)';
        ctx.lineWidth = 1.3;
        ctx.beginPath();
        ctx.moveTo(p.x - s, p.y - s + 6); ctx.lineTo(p.x - s, p.y - s); ctx.lineTo(p.x - s + 6, p.y - s);
        ctx.moveTo(p.x + s - 6, p.y - s); ctx.lineTo(p.x + s, p.y - s); ctx.lineTo(p.x + s, p.y - s + 6);
        ctx.moveTo(p.x + s, p.y + s - 6); ctx.lineTo(p.x + s, p.y + s); ctx.lineTo(p.x + s - 6, p.y + s);
        ctx.moveTo(p.x - s + 6, p.y + s); ctx.lineTo(p.x - s, p.y + s); ctx.lineTo(p.x - s, p.y + s - 6);
        ctx.stroke();
        ctx.restore();
      }
    }

    if (player.invuln > 0) {
      ctx.save();
      ctx.strokeStyle = 'rgba(132,255,172,' + (0.16 + 0.16 * Math.sin(game.time * 7)).toFixed(3) + ')';
      ctx.lineWidth = 1.2;
      ctx.setLineDash([5, 10]);
      ctx.beginPath();
      ctx.arc(cx, cy, 36, 0, TAU);
      ctx.stroke();
      ctx.restore();
    }

    if (!ready) {
      text('RELOADING', cx, cy + 42, { size: 10, color: C.hudWarm, spacing: 3, alpha: 0.8 });
    }
  }

  function drawPopups() {
    for (const p of popups) {
      const s = projectWorld(p.x, p.y, p.z);
      if (!s) continue;
      const a = clamp(p.life / p.maxLife, 0, 1);
      text(p.text, s.x, s.y, { size: p.size, color: p.color, alpha: a, glow: 7, spacing: 1 });
    }
  }

  function drawTouchControls() {
    const buttons = ['left', 'right', 'fwd', 'rev'];
    for (const key of buttons) {
      const b = TOUCH[key];
      let down = false;
      for (const v of touchActions.values()) if (v === key) down = true;
      if (key === 'left' && (keys.has('a') || keys.has('arrowleft'))) down = true;
      if (key === 'right' && (keys.has('d') || keys.has('arrowright'))) down = true;
      if (key === 'fwd' && (keys.has('w') || keys.has('arrowup'))) down = true;
      if (key === 'rev' && (keys.has('s') || keys.has('arrowdown'))) down = true;
      ctx.save();
      ctx.globalAlpha = down ? 0.34 : 0.16;
      ctx.fillStyle = '#a8ffc4';
      ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 10); ctx.fill();
      ctx.globalAlpha = down ? 0.95 : 0.55;
      ctx.strokeStyle = '#a8ffc4';
      ctx.lineWidth = 1.4;
      ctx.stroke();
      const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
      ctx.beginPath();
      if (key === 'left') {
        ctx.moveTo(cx + 9, cy - 12); ctx.lineTo(cx - 9, cy); ctx.lineTo(cx + 9, cy + 12);
      } else if (key === 'right') {
        ctx.moveTo(cx - 9, cy - 12); ctx.lineTo(cx + 9, cy); ctx.lineTo(cx - 9, cy + 12);
      } else if (key === 'fwd') {
        ctx.moveTo(cx - 13, cy + 8); ctx.lineTo(cx, cy - 9); ctx.lineTo(cx + 13, cy + 8);
      } else {
        ctx.moveTo(cx - 13, cy - 8); ctx.lineTo(cx, cy + 9); ctx.lineTo(cx + 13, cy - 8);
      }
      ctx.stroke();
      ctx.restore();
    }

    const f = TOUCH.fire;
    let firing = false;
    for (const v of touchActions.values()) if (v === 'fire') firing = true;
    if (keys.has(' ')) firing = true;
    ctx.save();
    ctx.globalAlpha = firing ? 0.36 : 0.16;
    ctx.fillStyle = '#a8ffc4';
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, TAU); ctx.fill();
    ctx.globalAlpha = firing ? 0.95 : 0.58;
    ctx.strokeStyle = '#a8ffc4';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r * 0.55, 0, TAU);
    ctx.stroke();
    text('FIRE', f.x, f.y, { size: 13, color: '#d8ffe4', spacing: 2, alpha: firing ? 1 : 0.75 });
    ctx.restore();
  }

  // ------------------------------------------------------------------ screens / render

    grad.addColorStop(0.88, 'rgba(0,6,3,0.4)');
    grad.addColorStop(1, 'rgba(0,6,3,0)');

    ctx.lineWidth = 1;

    ctx.moveTo(W / 2 - 310, 160); ctx.lineTo(W / 2 - 350, 160); ctx.lineTo(W / 2 - 350, 196);

      size: touch ? 9.5 : 11, color: C.dim, spacing: 2, weight: '600',
    });
    text('DEFEND THE SECTOR // DESTROY ALL HOSTILE VEHICLES', W / 2, 552, {
      size: 10, color: C.dim, spacing: 1.5, weight: '600',
    });

    text('A VECTOR ARCADE TRIBUTE', W / 2, 706, {
      size: 9, color: C.dim, spacing: 4, alpha: 0.65, weight: '600',
    });
    ctx.restore();
  }

  function drawOverlays() {
    if (game.mode === 'paused') {
      ctx.fillStyle = 'rgba(0,6,3,0.66)';
      ctx.fillRect(0, 0, W, H);
      panel(300, 284, 400, 188, 0.86);
      vtext('PAUSED', W / 2, 344, { size: 52, color: C.hud, glow: 24, spacing: 6 });
      text('P / ESC  OR  TAP TO RESUME', W / 2, 402, { size: 13, color: C.hud, spacing: 2 });
      text('R  RESTART      V  SOUND ' + (game.muted ? 'OFF' : 'ON') + (fromMenu ? '      M  MENU' : ''), W / 2, 438, {
        size: 10, color: C.dim, spacing: 2, weight: '600',
      });
    } else if (game.mode === 'waveclear') {
      ctx.fillStyle = 'rgba(0,6,3,0.3)';
      ctx.fillRect(0, 0, W, H);
      panel(250, 278, 500, 214, 0.84);
      vtext('SECTOR CLEARED', W / 2, 336, { size: 38, color: C.hud, glow: 20, spacing: 3 });
      text('WAVE ' + pad(game.wave, 2) + ' COMPLETE', W / 2, 380, {
        size: 12, color: C.dim, spacing: 3, weight: '600',
      });
      text('CLEARANCE BONUS   +' + game.lastBonus, W / 2, 414, {
        size: 16, color: C.hudWarm, spacing: 2, glow: 6,
      });
      text('AUTOLOADER REARMED', W / 2, 444, {
        size: 11, color: C.hud, spacing: 2, alpha: 0.7,
      });
      const frac = clamp(1 - game.waveTimer / 3.2, 0, 1);
      ctx.fillStyle = 'rgba(132,255,172,0.14)';
      ctx.fillRect(340, 464, 320, 4);
      ctx.fillStyle = C.hud;
      ctx.shadowColor = C.hud;
      ctx.shadowBlur = 8;
      ctx.fillRect(340, 464, 320 * frac, 4);
      ctx.shadowBlur = 0;
      text('NEXT WAVE', W / 2, 482, { size: 9, color: C.dim, spacing: 3, weight: '600' });
    } else if (game.mode === 'gameover') {
      ctx.fillStyle = 'rgba(0,6,3,0.78)';
      ctx.fillRect(0, 0, W, H);
      panel(230, 166, 540, 414, 0.9);
      vtext('GAME OVER', W / 2, 240, { size: 62, color: '#ff9a7a', glow: 28, spacing: 6, lineWidth: 2.3 });
      text('FINAL SCORE', W / 2, 306, { size: 10, color: C.dim, spacing: 4, weight: '600' });
      text(pad(game.score, 6), W / 2, 346, { size: 44, color: C.hud, glow: 16, spacing: 2 });
      text('HI-SCORE   ' + pad(game.hi, 6), W / 2, 396, { size: 12, color: C.hud, spacing: 3, alpha: 0.72 });
      text('WAVE REACHED   ' + pad(game.wave, 2), W / 2, 424, { size: 11, color: C.dim, spacing: 3, weight: '600' });
      text('VEHICLES DESTROYED   ' + pad(game.kills, 3), W / 2, 450, {
        size: 11, color: C.dim, spacing: 2, weight: '600',
      });

      if (game.newHi) {
        const b = 0.5 + 0.5 * Math.sin(game.time * 4.2);
        text('NEW HIGH SCORE', W / 2, 488, {
          size: 18, color: C.hudWarm, glow: 12, alpha: b, spacing: 2,
        });
      }
      const blink = 0.58 + 0.32 * Math.sin(game.time * 3.6);
      text('CLICK / TAP  OR  PRESS SPACE TO REDEPLOY', W / 2, 528, {
        size: 15, color: C.hud, glow: 8, alpha: blink, spacing: 1,
      });
      text('R  RESTART', W / 2, 554, { size: 9, color: C.dim, spacing: 4, weight: '600' });
    }
  }

  const skyGrad = ctx.createLinearGradient(0, 0, 0, HORIZON);
  skyGrad.addColorStop(0, '#010503');
  skyGrad.addColorStop(0.55, '#020b06');
  skyGrad.addColorStop(1, '#000402');

  const groundGrad = ctx.createLinearGradient(0, HORIZON, 0, H);
  groundGrad.addColorStop(0, 'rgba(22,78,46,0.20)');
  groundGrad.addColorStop(0.3, 'rgba(8,34,20,0.16)');
  groundGrad.addColorStop(1, 'rgba(0,5,3,0.04)');

  function render() {
    if (game.mode !== 'menu') {
      cam.x = player.x;
      cam.z = player.z;
      cam.h = player.h;
      const sp = clamp(Math.abs(player.speed) / MAX_FWD, 0, 1);
      cam.eye = EYE + Math.sin(player.bob * 2.2) * 0.55 * sp;
    }

    renderScene();

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, HORIZON);
    ctx.fillStyle = groundGrad;
    ctx.fillRect(0, HORIZON, W, H - HORIZON);

    ctx.fillStyle = 'rgba(132,255,172,0.16)';
    ctx.fillRect(0, HORIZON, W, 1);

    let sx = 0, sy = 0;
    if (game.shake > 0) {
      sx = rand(-game.shake, game.shake) * 0.34;
      sy = rand(-game.shake, game.shake) * 0.34;
    }
    sy += cam.recoil * 2.4;

    const flick = game.flicker > 0 ? rand(0.62, 0.85) : 0.975 + 0.025 * Math.sin(game.time * 47);
    ctx.globalAlpha = flick;
    ctx.drawImage(sceneCanvas, sx, sy);
    ctx.globalAlpha = 1;

    if (game.flash > 0) {
      ctx.fillStyle = 'rgba(190,255,210,' + (game.flash * 0.055).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
    if (game.damage > 0) {
      const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.18, W / 2, H / 2, H * 0.72);
      g.addColorStop(0, 'rgba(255,40,20,0)');
      g.addColorStop(0.62, 'rgba(255,40,20,' + (0.11 * game.damage).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(255,30,10,' + (0.45 * game.damage).toFixed(3) + ')');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }

    if (game.mode !== 'menu') drawHud();
    if (game.mode === 'paused' || game.mode === 'waveclear' || game.mode === 'gameover') drawOverlays();
    if (game.mode === 'menu') drawMenuOverlay();

    canvas.style.cursor = game.mode === 'playing' ? 'none' : 'crosshair';
  }

  // ------------------------------------------------------------------ go
  syncUi();
  let lastTime = performance.now();

  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - lastTime) / 1000));
    lastTime = now;
    if (!frameFault) {
      try {
        update(dt);
        render();
      } catch (err) {
        // A thrown frame must never stop requestAnimationFrame for good while
        // the audio engine keeps droning. Freeze on a safe fault screen that
        // offers a restart instead.
        frameFault = true;
        console.error('Battlezone frame error:', err);
        game.mode = 'fault';
        syncUi();
        try { if (audioCtx) audioCtx.suspend(); } catch (ignored) { /* no audio */ }
        try {
          ctx.save();
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.globalAlpha = 1;
          ctx.globalCompositeOperation = 'source-over';
          ctx.fillStyle = 'rgba(1,6,3,0.82)';
          ctx.fillRect(0, 0, W, H);
          ctx.restore();
          text('SYSTEM FAULT', W / 2, H / 2 - 26, {
            size: 30, color: C.hudRed, glow: 18, spacing: 4,
          });
          text(touchControlsActive() ? 'TAP TO RESTART' : 'PRESS R TO RESTART', W / 2, H / 2 + 28, {
            size: 13, color: C.hud, glow: 10, spacing: 3,
          });
          canvas.style.cursor = 'default';
        } catch (ignored) { /* last-resort screen only */ }
      }
    }
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);










})();
</script>
</body>
</html>
